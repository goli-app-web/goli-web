<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'unsafe-inline';" />
<meta name="robots" content="noindex" />
<title>Goli</title>
<link rel="icon" href="assets/icon.png" />
<link rel="apple-touch-icon" href="assets/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#000; --card:#0c0e0d; --line:#1c1f1e; --text:#f4f6f5; --text-2:#9aa3a0; --accent:#10b981; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Hanken Grotesk',system-ui,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:40px 32px; max-width:420px; width:100%; text-align:center;
  }
  .card img{ width:64px; height:64px; border-radius:16px; margin-bottom:20px; }
  h1{ font-size:1.35rem; font-weight:800; letter-spacing:-.02em; margin-bottom:10px; }
  p{ color:var(--text-2); font-size:.95rem; line-height:1.55; margin-bottom:26px; }
  .btn{
    display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
    font-weight:700; font-size:1rem; padding:15px 36px; border-radius:13px;
    transition:transform .2s, opacity .2s;
  }
  .btn:hover{ transform:translateY(-2px); opacity:.92; }
  .hint{ margin-top:22px; margin-bottom:0; font-size:.8rem; color:var(--text-2); }
  .err{ color:#f87171; margin-bottom:0; }
</style>
</head>
<body>
<div class="card">
  <img src="assets/icon.png" alt="Goli" />
  <h1 id="title">Konfirmo emailin tënd</h1>
  <p id="desc">Shtyp butonin për të hapur aplikacionin Goli dhe për të vazhduar.</p>
  <a class="btn" id="open" href="#">Hap Goli</a>
  <p class="hint" id="hint">Nëse butoni nuk funksionon, hape këtë faqe në telefonin ku e ke instaluar aplikacionin Goli.</p>
</div>
<script>
  var STRINGS = {
    sq: {
      confirmTitle: 'Konfirmo emailin tënd', recoveryTitle: 'Rivendos fjalëkalimin',
      desc: 'Shtyp butonin për të hapur aplikacionin Goli dhe për të vazhduar.',
      btn: 'Hap Goli',
      hint: 'Nëse butoni nuk funksionon, hape këtë faqe në telefonin ku e ke instaluar aplikacionin Goli.',
      err: 'Ky link nuk është i vlefshëm. Të lutem kërko një email të ri nga aplikacioni.'
    },
    de: {
      confirmTitle: 'E-Mail bestätigen', recoveryTitle: 'Passwort zurücksetzen',
      desc: 'Tippe auf den Button, um die Goli-App zu öffnen und fortzufahren.',
      btn: 'Goli öffnen',
      hint: 'Wenn der Button nicht funktioniert, öffne diese Seite auf dem Handy, auf dem die Goli-App installiert ist.',
      err: 'Dieser Link ist ungültig. Bitte fordere in der App eine neue E-Mail an.'
    },
    en: {
      confirmTitle: 'Confirm your email', recoveryTitle: 'Reset your password',
      desc: 'Tap the button to open the Goli app and continue.',
      btn: 'Open Goli',
      hint: 'If the button does not work, open this page on the phone where the Goli app is installed.',
      err: 'This link is not valid. Please request a new email from the app.'
    }
  };
  var p = new URLSearchParams(location.search);
  var lang = ['sq','de','en'].indexOf(p.get('lang')) >= 0 ? p.get('lang') : 'sq';
  var s = STRINGS[lang];
  var isRecovery = p.get('type') === 'recovery';
  var token = p.get('token') || '';
  var email = p.get('email') || '';

  document.documentElement.lang = lang;
  document.getElementById('title').textContent = isRecovery ? s.recoveryTitle : s.confirmTitle;
  document.getElementById('desc').textContent = s.desc;
  document.getElementById('hint').textContent = s.hint;
  var btn = document.getElementById('open');
  btn.textContent = s.btn;

  if (token && email) {
    var qs = 'token=' + encodeURIComponent(token) + '&email=' + encodeURIComponent(email);
    btn.href = 'goli://' + (isRecovery ? 'reset-password' : 'login') + '?' + qs;
  } else {
    btn.style.display = 'none';
    var desc = document.getElementById('desc');
    desc.textContent = s.err;
    desc.className = 'err';
    document.getElementById('hint').style.display = 'none';
  }
</script>
</body>
</html>
